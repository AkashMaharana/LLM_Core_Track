[project]
name = "core-track"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Akash Maharana", email = "akashmaharana93@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.15.0",
    "beautifulsoup4>=4.15.0",
    "bitsandbytes>=0.50.2",
    "chromadb>=1.5.9",
    "datasets>=5.0.1",
    "dotenv>=0.9.9",
    "faiss-cpu>=1.15.1",
    "gensim>=4.4.0",
    "gradio>=6.28.0",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.3",
    "langchain-text-splitters>=1.1.2",
    "modal[api-proxy-support]>=1.5.5",
    "numpy>=2.4.6",
    "openai>=3.16.2",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "tiktoken>=0.14.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "trl>=1.14.0",
    "truststore>=0.10.4",
]

[project.scripts]
core-track = "core_track:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
